version: '3.8'

services:
  mysql:
    image: mysql
    container_name: mysql-db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: todo-system
      MYSQL_USER: user
      MYSQL_PASSWORD: userpass
      MYSQL_ROOT_HOST: '%'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: